[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-lyrics-wallpaper"
version = "1.0.0"
description = "Aesthetic handwriting lyrics wallpaper generator for OLED mobile and 4K desktop displays using Spotify data."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Spotify Lyrics Wallpaper Contributors" }
]
keywords = [
    "spotify",
    "lyrics",
    "wallpaper",
    "aesthetic",
    "minimalist",
    "typography",
    "oled",
    "4k",
    "generative-art"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software"
]
dependencies = [
    "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
spotify-wallpaper = "spotify_wallpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
